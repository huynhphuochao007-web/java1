<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        #image {
            width: 575px;
            height: 300px;
            line-height: 300px;
            border: 5px solid #2c3e50;
            margin: 20px auto;
            text-align: center;
            background-color: #8e68ff;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-size: 150%;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .gallery-container {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            max-width: 800px;
            margin: 30px auto;
            padding: 15px;
            background-color: #ffffff;
            border: 2px dashed #95a5a6;
            border-radius: 12px;
        }

        .preview {
            width: 28%;
            height: 140px;
            object-fit: cover;
            border: 4px solid #3498db;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .preview:hover {
            transform: scale(1.05);
            border-color: #e74c3c;
        }
    </style>
</head>
<body>

    <div id="image">
        Hover over an image below to display here.
    </div>

    <div class="gallery-container">
        <img class="preview" 
             alt="Styling with a image preview" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon.jpg" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="With the boy" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon2.JPG" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">

        <img class="preview" 
             alt="Young puppy" 
             src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/389177/bacon3.jpg" 
             onmouseover="upDate(this)" 
             onmouseout="unDo()">
    </div>

    <script src="script.js"></script>
</body>
</html>
